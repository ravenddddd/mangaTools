# Manga Tools — one plugin for managing a manga library in Stash and reading it.
#
# The plugin ID comes from this file's name (mangaTools), not from a config
# field. Paths under ui.javascript are relative to this file and are loaded in
# array order. There is only one entry: the bundled output of src/mangaTools.tsx,
# the two halves of the plugin and the modules they share inlined into it by
# esbuild (see build.mjs), so there is no load order to get wrong.
#
# Both halves' settings live here, in Stash's own configuration, and both are
# written by the settings page this plugin draws for itself. What is *not* here is
# how the reader is set up — one page or two, the fade, the cover on its own — which
# belongs beside the lightbox options it sits with; that half's settings are stored
# as one JSON string in `readerSettings` below, so that every browser reads the same
# way. See src/reader/settings.ts.
name: Manga Tools
description: Manages manga galleries in Stash — language, censorship and translation group — and reads them two pages at a time.
# Shown as the link button beside the plugin in Settings → Plugins.
url: https://github.com/ravenddddd/mangaTools
version: 0.9.88
ui:
  javascript:
    - mangaTools.js
  css:
    # The tools half's, then the reader's. Kept apart rather than concatenated:
    # each names its own classes and the browser can cache the one that did not
    # change.
    - mangaTools.css
    - mangaReader.css
  # The things this plugin ships that are not code: the icon for the mark that
  # makes a gallery manga, and the two steaks the original-text button draws
  # (raw.svg for the original text, cooked.svg for a translation). Stash serves a mapped directory at
  # /plugin/{pluginId}/assets/<path>, so `assets/icons/x.svg` is fetched from
  # /plugin/mangaTools/assets/icons/x.svg.
  #
  # They are files rather than paths in the bundle because they are somebody else's
  # artwork and are kept exactly as downloaded, attribution comment and all.
  # Colouring them is done with a CSS mask, which reads the shape rather than the
  # colour — see the three .manga-tools-*-icon rules in mangaTools.css.
  #
  # `build.mjs` copies whatever this maps, so a directory named here is a
  # directory that ships; naming one that does not exist fails the build.
  assets:
    /: assets

# Plugin settings, editable under Settings → Plugins. Stash renders one plain
# input per entry below (STRING/NUMBER/BOOLEAN only); the plugin patches that UI
# for itself and draws a page of its own — switches grouped under the feature they
# belong to, the rows a switch holds appearing only while it is on, and a
# multiselect. All of them live in Configuration.plugins.mangaTools.
#
# Three of them are *features*, and off means the plugin does not do that thing at all:
#   readerTakeover    read a marked gallery in this plugin's own lightbox
#   manageChapters    the Chapters tab's editing writes this plugin's field
#   fields            the custom fields, all four of them, master switch
#
# Four are the fields themselves, under that master:
#   fieldLanguage / fieldCensorship / fieldTranslationGroup / fieldOriginal
#
# Three are how the mark itself behaves:
#   coverIcon         draw the mark's icon in a gallery cover's info row
#   confirmUnmark     ask before taking the mark off
#   deleteOnUnmark    and take this plugin's fields off with it
#
# And the rest are how the fields are shown — the language's four under its own
# switch, the last three under a heading of their own:
#   enabledLanguages  comma-separated canonical codes; empty = no restriction
#   showFlags         draw flags, or names on their own
#   showCoverBadge    draw the badge on gallery covers (independent of showFlags)
#   openDetailsBlock  the state the details tab's block opens in
#   openEditBlock     the state the edit form's block opens in
#   hidePerformers    leave the performers field out of a manga gallery's edit page
#   showDisabledFields  a disabled field is drawn by Stash rather than hidden
#
# Everything is absent until the user changes something, and an absent value reads as
# the default — and every default is what the plugin did before the setting existed,
# so an install that has never been touched behaves as it always did.
settings:
  readerTakeover:
    displayName: Take over Stash's lightbox
    description: A gallery marked as manga is read in this plugin's own lightbox, redesigned from the ground up. Nothing about Stash's own lightbox settings is changed.
    type: BOOLEAN
  manageChapters:
    displayName: Take over the Chapters tab
    description: Creating and editing chapters is this plugin's job, and writing them stores this plugin's own chapter field. Stash's existing chapters are brought over quietly, and are never modified.
    type: BOOLEAN
  fields:
    displayName: Custom fields
    description: The plugin's fields are written as custom fields, so none of Stash's own data is touched. Turning one off does not clear the values already on your galleries.
    type: BOOLEAN
  fieldLanguage:
    displayName: Language
    description: One of the custom fields. Turned off, the language row, badge and filter are not drawn; the values already on galleries are kept.
    type: BOOLEAN
  fieldCensorship:
    displayName: Censorship
    description: One of the custom fields. Turned off, its row, badge and filter are not drawn; the values already on galleries are kept.
    type: BOOLEAN
  fieldTranslationGroup:
    displayName: Translation group
    description: One of the custom fields. Turned off, its row and the group menu are not drawn; the values already on galleries are kept.
    type: BOOLEAN
  fieldOriginal:
    displayName: Raw
    description: One of the custom fields — the gallery is the original text and nothing was translated. Turned off, its row is not drawn; the values already on galleries are kept.
    type: BOOLEAN
  coverIcon:
    displayName: Show the manga icon on gallery covers
    description: The icon at the end of a cover's info row — the row that appears on hover, with the image count and the tag count. Turned off, the cover carries no mark, and the gallery is still managed.
    type: BOOLEAN
  confirmUnmark:
    displayName: Ask before unmarking
    description: A gallery stops being manga only after a confirmation.
    type: BOOLEAN
  deleteOnUnmark:
    displayName: Remove this plugin's custom fields when unmarking
    description: On, unmarking clears this plugin's custom fields with it. Off, the values are kept on the gallery — hidden, and back if it is marked again.
    type: BOOLEAN
  enabledLanguages:
    displayName: Enabled languages
    description: Only these languages appear in the edit-page dropdown. Display (badge and detail row) is unaffected. Leave empty to show every language.
    type: STRING
  showFlags:
    displayName: Show flags
    description: Draw the flag beside the language name. Turn this off to show the name on its own.
    type: BOOLEAN
  showCoverBadge:
    displayName: Show the language on gallery covers
    description: The badge in the bottom-right of a gallery's cover. With flags turned off it shows the language name instead of a flag.
    type: BOOLEAN
  openDetailsBlock:
    displayName: Start the manga info section expanded
    description: The Manga info section in a gallery's details tab. Collapsed, its heading is what says the section is there. Only affects the state a block opens in.
    type: BOOLEAN
  openEditBlock:
    displayName: Start the manga info block expanded
    description: The Manga info block in a gallery's edit form, holding the language, censorship and translation group fields. Only affects the state a block opens in.
    type: BOOLEAN
  hidePerformers:
    displayName: Hide the performers field on the edit page
    description: A manga gallery rarely has performers, so its edit page leaves the field out to make the form easier to fill in. Whatever a gallery already has stays on the gallery and is kept when it is saved. The bulk edit dialog and the details tab are unaffected.
    type: BOOLEAN
  showDisabledFields:
    displayName: Show disabled plugin fields
    description: A disabled field is no longer hidden — Stash draws its own custom-field row for it in the details tab and the edit form. The value itself is not changed. The bulk edit dialog and the sidebar are unaffected.
    type: BOOLEAN
  sidebarFilters:
    displayName: Sidebar filters
    description: Which of this plugin's filters the gallery list's sidebar offers. A filter for a field that is switched off cannot be shown, and is not remembered while it is hidden — turning the field back on brings its filter back. Leave empty to offer none of them.
    type: STRING
  # The reading half's own settings, as the JSON string they are stored as. They are
  # *not* rendered on the settings page — the plugin's own UI is what draws that page,
  # and where a reader changes these is the lightbox they belong to — but they are
  # declared here because this is the plugin's settings map, and this is what says so.
  # See src/reader/settings.ts for the shape and for why they live with the library
  # rather than with the browser.
  readerSettings:
    displayName: Reader settings
    description: The reading half's settings — how the pages are laid out, whether the cover stands alone, and the rest. Changed in the lightbox's own options menu rather than here. Stored with the library, so every browser reads the same way.
    type: STRING
